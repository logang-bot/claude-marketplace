name: validate

on:
  push:
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json; do
            [ -e "$f" ] || continue
            python3 -m json.tool "$f" > /dev/null
            echo "ok  $f"
          done

      - name: Check every marketplace source path exists
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          data = json.load(open('.claude-plugin/marketplace.json'))
          failed = False
          for entry in data['plugins']:
              source = entry['source']
              if not isinstance(source, str):
                  continue
              manifest = pathlib.Path(source) / '.claude-plugin' / 'plugin.json'
              if not manifest.is_file():
                  print(f"missing {manifest} for plugin {entry['name']}")
                  failed = True
                  continue
              name = json.load(open(manifest))['name']
              if name != entry['name']:
                  print(f"name mismatch: marketplace says {entry['name']}, manifest says {name}")
                  failed = True
              else:
                  print(f"ok  {entry['name']}")
          sys.exit(1 if failed else 0)
          PY

      - name: Check skill frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, sys
          failed = False
          for skill in pathlib.Path('plugins').glob('*/skills/*/SKILL.md'):
              lines = skill.read_text().split('\n')
              if lines[0] != '---' or '---' not in lines[1:]:
                  print(f"{skill}: missing frontmatter")
                  failed = True
                  continue
              front = lines[1:lines.index('---', 1)]
              keys = {line.split(':', 1)[0].strip() for line in front if ':' in line}
              missing = {'name', 'description'} - keys
              if missing:
                  print(f"{skill}: missing {', '.join(sorted(missing))}")
                  failed = True
              else:
                  print(f"ok  {skill}")
          sys.exit(1 if failed else 0)
          PY

      - name: Check skill directory names match frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, sys
          failed = False
          for skill in pathlib.Path('plugins').glob('*/skills/*/SKILL.md'):
              lines = skill.read_text().split('\n')
              front = lines[1:lines.index('---', 1)]
              name = next((l.split(':', 1)[1].strip() for l in front
                           if l.split(':', 1)[0].strip() == 'name'), None)
              if name != skill.parent.name:
                  print(f"{skill}: frontmatter name {name!r} != directory {skill.parent.name!r}")
                  failed = True
              else:
                  print(f"ok  {skill.parent.name}")
          sys.exit(1 if failed else 0)
          PY

      - name: Check command and agent frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, sys
          failed = False
          targets = list(pathlib.Path('plugins').glob('*/commands/*.md'))
          targets += list(pathlib.Path('plugins').glob('*/agents/*.md'))
          for doc in targets:
              lines = doc.read_text().split('\n')
              if lines[0] != '---' or '---' not in lines[1:]:
                  print(f"{doc}: missing frontmatter")
                  failed = True
                  continue
              front = lines[1:lines.index('---', 1)]
              keys = {l.split(':', 1)[0].strip() for l in front if ':' in l}
              if 'description' not in keys:
                  print(f"{doc}: missing description")
                  failed = True
              else:
                  print(f"ok  {doc}")
          sys.exit(1 if failed else 0)
          PY

      - name: Check hook scripts parse
        run: |
          # The syntax floor. A hook that cannot run is indistinguishable, in the
          # moment, from a hook that decided to allow everything.
          #
          # awk modules load per plugin rather than one at a time: a module alone
          # cannot see the functions its siblings define, and loading the set also
          # catches a name used as a function in one file and a variable in another.
          for f in $(find plugins -name '*.sh'); do sh -n "$f" && echo "ok  $f"; done
          for plugin in plugins/*/; do
            modules=$(find "$plugin" -name '*.awk' | sort)
            [ -n "$modules" ] || continue
            args=""
            for m in $modules; do args="$args -f $m"; done
            problems=$(awk $args </dev/null 2>&1 >/dev/null) || true
            if [ -n "$problems" ]; then echo "$problems"; exit 1; fi
            echo "ok  $plugin awk modules parse together"
          done

      - name: Run the hook tests
        run: |
          # Parsing proves nothing about the logic, and hooks fail open — a guard that
          # stops guarding is silent.
          for suite in plugins/*/tests/test_*.sh; do
            echo "== $suite"
            sh "$suite"
          done

      - name: Check for project-specific leakage
        run: |
          # Scoped to shipped plugin content. docs/ and .github/ are excluded on purpose:
          # they document these patterns, so they legitimately contain the words.
          if grep -rniE 'restrusher|in this project we|domain/usecase/' \
               --include='*.md' --include='*.json' --include='*.sh' --include='*.awk' \
               .claude-plugin plugins README.md; then
            echo "found a reference that ties a plugin to one project or the old owner"
            exit 1
          fi
          echo "ok  no project-specific references"

  windows:
    # The plugins ship shell and awk precisely so they run here. Nothing else proves that:
    # a CRLF checkout, a path that arrives with backslashes, or an awk that is missing from
    # Git Bash all fail on Windows and nowhere else. windows-latest provides Git Bash as
    # `bash`, which is the same shell Claude Code picks for hooks on a machine with git.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the runtime the plugins depend on
        run: |
          command -v awk && awk --version 2>/dev/null | head -1 || awk -W version 2>&1 | head -1
          command -v git && git --version

      - name: Check the checkout kept LF endings
        run: |
          # .gitattributes pins eol=lf. Without it a core.autocrlf checkout hands bash
          # scripts with CRLF endings, and bash fails on those with `\r: command not found`
          # — a silent hook failure, which is the bug this migration exists to end.
          for f in $(find plugins -name '*.sh' -o -name '*.awk'); do
            if grep -qU $'\r' "$f"; then echo "CRLF in $f"; exit 1; fi
          done
          echo "ok  no CRLF in any shipped script"

      - name: Check hook scripts parse
        run: |
          # The syntax floor. A hook that cannot run is indistinguishable, in the
          # moment, from a hook that decided to allow everything.
          #
          # awk modules load per plugin rather than one at a time: a module alone
          # cannot see the functions its siblings define, and loading the set also
          # catches a name used as a function in one file and a variable in another.
          for f in $(find plugins -name '*.sh'); do sh -n "$f" && echo "ok  $f"; done
          for plugin in plugins/*/; do
            modules=$(find "$plugin" -name '*.awk' | sort)
            [ -n "$modules" ] || continue
            args=""
            for m in $modules; do args="$args -f $m"; done
            problems=$(awk $args </dev/null 2>&1 >/dev/null) || true
            if [ -n "$problems" ]; then echo "$problems"; exit 1; fi
            echo "ok  $plugin awk modules parse together"
          done

      - name: Run the hook tests
        run: |
          for suite in plugins/*/tests/test_*.sh; do
            echo "== $suite"
            sh "$suite"
          done
